services:
  db:
    image: postgres:16-alpine
    container_name: jobaggregator-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobaggregator}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jobaggregator}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobnetwork

  ai:
    build:
      context: ./back
    container_name: jobaggregator-ai
    restart: unless-stopped
    environment:
      OLLAMA_HOST: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    ports:
      - "${AI_PORT:-8010}:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8010/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - jobnetwork

  backend:
    build:
      context: ./backend
    container_name: jobaggregator-backend
    restart: unless-stopped
    command: sh -c "npm run prisma:deploy && npm run dev"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-jobaggregator}
      JWT_SECRET: ${JWT_SECRET:-replace-me}
      API_KEY: ${API_KEY:-}
      API_URL: ${API_URL:-https://epi-api.welovedevs.com}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8010}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-60000}
      PORT: 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobnetwork

  frontend:
    build:
      context: ./frontend
    container_name: jobaggregator-frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - jobnetwork

volumes:
  postgres_data:

networks:
  jobnetwork:
    driver: bridge
